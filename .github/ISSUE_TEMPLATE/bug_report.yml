name: Bug report
description: Report a reproducible problem in LowQuery.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please write in English and check existing issues first. Never paste passwords, connection strings with credentials, host names you consider private or real business data. Use a small synthetic table to reproduce.
  - type: input
    id: version
    attributes:
      label: LowQuery version
      placeholder: "Example: 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and installation format
      placeholder: "Example: Windows 11 x64, setup .exe"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options:
        - PostgreSQL
        - Oracle
        - Not related to a specific database
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server version and hosting
      description: For example "PostgreSQL 16.4 on Amazon RDS" or "Oracle 19c on-premises, TCPS". Shown in the status bar after connecting.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest SQL that shows the problem, with a CREATE TABLE and a few INSERTs when the data matters.
      placeholder: |
        1. Connect to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and code (SQLSTATE or ORA-NNNNN) from the Messages tab.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Optional. Remove sensitive data before attaching files.
