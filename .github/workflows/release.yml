name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Version files match the tag
        id: version
        run: bun scripts/check-version.mjs "$RELEASE_TAG"

  # Same checks as every pull request, run against the tagged code before any
  # installer is built.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows x64
    needs: [verify, checks]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - name: Build with Tauri
        run: bun run tauri build
      - name: Collect installers and portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found." }
          Copy-Item $nsis.FullName "out/LowQuery-$env:VERSION-windows-x64-setup.exe"

          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "out/LowQuery-$env:VERSION-windows-x64.msi" }

          $portable = "out/LowQuery-$env:VERSION-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "src-tauri/target/release/lowquery.exe" "$portable/LowQuery.exe"
          Copy-Item README.md, LICENSE $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip" -Force
          Remove-Item -Recurse -Force $portable

          Get-ChildItem out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowquery-windows
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: [verify, checks]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install system libraries (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libappindicator3-dev \
            librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bun install --frozen-lockfile
      - name: Build with Tauri
        run: bun run tauri build
      - name: Collect packages and portable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          cp "$(find $bundle/deb -name '*.deb' | head -n 1)" "out/LowQuery-${VERSION}-linux-x64.deb"
          cp "$(find $bundle/rpm -name '*.rpm' | head -n 1)" "out/LowQuery-${VERSION}-linux-x64.rpm"
          cp "$(find $bundle/appimage -name '*.AppImage' | head -n 1)" "out/LowQuery-${VERSION}-linux-x64.AppImage"

          portable="out/LowQuery-${VERSION}-linux-x64-portable"
          mkdir -p "$portable"
          cp src-tauri/target/release/lowquery "$portable/LowQuery"
          chmod +x "$portable/LowQuery"
          cp README.md LICENSE "$portable/"
          tar -czf "$portable.tar.gz" -C "$portable" .
          rm -rf "$portable"

          (cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowquery-linux
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: [verify, checks]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: bun install --frozen-lockfile
      - name: Build with Tauri (universal)
        run: bun run tauri build --target universal-apple-darwin
      - name: Collect DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          cp "$dmg" "out/LowQuery-${VERSION}-macos-universal.dmg"
          (cd out && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lowquery-macos
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish to GitHub Releases
    needs: [verify, windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Build provenance attestations (Sigstore) for every published file.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create the draft release if it does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # A maintainer usually writes the notes in a draft before the build
          # finishes; otherwise GitHub generates them from merged pull requests.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --draft --title "LowQuery $VERSION"
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release-assets/LowQuery-${{ needs.verify.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/LowQuery-*
            release-assets/SHA256SUMS
      - name: Upload files and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f)
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
