name: Verify changes

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:
  # The release workflow reuses these checks before building installers.
  workflow_call:

permissions:
  contents: read

env:
  # Debug-build driver futures (SQL Server TLS above all) need more than the
  # 2 MiB default stack of test and tokio worker threads.
  RUST_MIN_STACK: "16777216"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run check
      - run: bun test
      - run: python -m unittest discover -s .github/scripts -p "test_*.py"
      - run: bun run build
      - name: Production bundle has no development mock
        run: |
          if grep -rl "installDevMock" dist/assets; then
            echo "The development mock leaked into the production bundle." >&2
            exit 1
          fi

  lint:
    name: Rust format and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: lint
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      # The Tauri context macro needs the frontend output folder to exist.
      - run: mkdir -p dist
      - name: rustfmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - name: Create frontend output folder
        shell: bash
        run: mkdir -p dist
      - name: Rust tests
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml

  postgres:
    name: PostgreSQL integration (${{ matrix.postgres }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: lowquery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LQ_PG_HOST: localhost
      LQ_PG_PORT: "5432"
      LQ_PG_USER: postgres
      LQ_PG_PASSWORD: lowquery
      LQ_PG_DB: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: postgres
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml postgres -- --ignored --test-threads=1

  oracle:
    name: Oracle integration (${{ matrix.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Free 23ai
            image: gvenzl/oracle-free:23-slim-faststart
            service: FREEPDB1
          # 21c, like 19c, does not mark the end of a response, so the driver
          # parses multi-packet responses the way it does on most servers.
          - name: XE 21c
            image: gvenzl/oracle-xe:21-slim-faststart
            service: XEPDB1
    services:
      oracle:
        image: ${{ matrix.image }}
        env:
          ORACLE_PASSWORD: lowquery
          APP_USER: lowquery
          APP_USER_PASSWORD: lowquery
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      LQ_ORA_HOST: localhost
      LQ_ORA_PORT: "1521"
      LQ_ORA_SERVICE: ${{ matrix.service }}
      LQ_ORA_USER: lowquery
      LQ_ORA_PASSWORD: lowquery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: oracle-${{ matrix.service }}
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml oracle -- --ignored --test-threads=1

  mysql:
    name: ${{ matrix.name }} integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: mysql:8.4
            engine: mysql
            health: mysqladmin ping -h 127.0.0.1 -plowquery
          - name: MariaDB 11.4
            image: mariadb:11.4
            engine: mariadb
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: lowquery
          MYSQL_DATABASE: lowquery
          MARIADB_ROOT_PASSWORD: lowquery
          MARIADB_DATABASE: lowquery
        ports: ["3306:3306"]
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      LQ_MYSQL_HOST: 127.0.0.1
      LQ_MYSQL_PORT: "3306"
      LQ_MYSQL_USER: root
      LQ_MYSQL_PASSWORD: lowquery
      LQ_MYSQL_DB: lowquery
      LQ_MYSQL_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: mysql
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml drivers::mysql -- --ignored --test-threads=1
      - name: MCP tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml mcp_mysql -- --ignored --test-threads=1

  sqlserver:
    name: SQL Server 2022 integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: LowQuery-2026!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LowQuery-2026!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      LQ_MSSQL_HOST: 127.0.0.1
      LQ_MSSQL_PORT: "1433"
      LQ_MSSQL_USER: sa
      LQ_MSSQL_PASSWORD: LowQuery-2026!
      LQ_MSSQL_DB: master
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: sqlserver
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml drivers::sqlserver -- --ignored --test-threads=1
      - name: MCP tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml mcp_sqlserver -- --ignored --test-threads=1

  redis:
    name: ${{ matrix.name }} integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Redis 7.4
            image: redis:7.4
          - name: Valkey 8
            image: valkey/valkey:8
    services:
      kv:
        image: ${{ matrix.image }}
        ports: ["6379:6379"]
    env:
      LQ_REDIS_HOST: 127.0.0.1
      LQ_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: redis
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml drivers::redis_db -- --ignored --test-threads=1
      - name: MCP tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml mcp_redis -- --ignored --test-threads=1

  cassandra:
    name: Cassandra ${{ matrix.version }} integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["4.1", "5.0"]
    services:
      cassandra:
        image: cassandra:${{ matrix.version }}
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 200M
        ports: ["9042:9042"]
        # The server takes about a minute to accept CQL connections.
        options: >-
          --health-cmd "cqlsh -e 'SELECT release_version FROM system.local'"
          --health-interval 15s --health-timeout 10s --health-retries 20 --health-start-period 40s
    env:
      LQ_CASSANDRA_HOST: 127.0.0.1
      LQ_CASSANDRA_PORT: "9042"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: cassandra
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev
      - run: mkdir -p dist
      - name: Integration tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml drivers::cassandra -- --ignored --test-threads=1
      - name: MCP tests against a real server
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml mcp_cassandra -- --ignored --test-threads=1
      - name: Export and import round trip
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml cassandra_export_import -- --ignored --test-threads=1

  # Builds the native Arch package the release publishes. Manual runs only:
  # it compiles the whole app, which pull requests do not need.
  arch-package:
    name: Arch Linux package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system libraries (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libappindicator3-dev \
            librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: arch
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --no-bundle
      - name: makepkg in an Arch container
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          arch_build="$PWD/arch-build"
          mkdir -p "$arch_build"
          cp src-tauri/target/release/lowquery "$arch_build/lowquery"
          cp src-tauri/icons/128x128.png "$arch_build/lowquery.png"
          cp packaging/arch/lowquery.desktop "$arch_build/lowquery.desktop"
          python3 .github/scripts/render_pkgbuild.py local "$version" "$arch_build"
          docker run --rm -v "$arch_build":/workspace -w /workspace archlinux:base-devel bash -c "
            useradd -m builder && chown -R builder:builder /workspace &&
            su builder -c 'makepkg -f --nodeps' &&
            pacman -Qip *.pkg.tar.zst && pacman -Qlp *.pkg.tar.zst
          "
