# cargo-deny configuration: `cargo deny --manifest-path src-tauri/Cargo.toml check advisories bans sources`
# Run weekly and on dependency changes by .github/workflows/security.yml.

[graph]
all-features = false

[advisories]
# Known vulnerabilities always fail. Unmaintained notices are reported only for
# crates we depend on directly; transitive ones (gtk/zbus stacks pulled in by
# Tauri) are tracked through upstream updates.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # zip < 9 extraction (SUID bits, symlinks out of the target, permissions
    # through symlinks). Only tauri-plugin-updater 2.14 (the latest) uses zip,
    # pinned to 4.x, and it unzips Windows update packages only after checking
    # their minisign signature against LowQuery's update key, so a crafted
    # archive needs that key. Drop these when the plugin moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater; packages are signature-checked before extraction" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater; packages are signature-checked before extraction" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater; packages are signature-checked before extraction" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
