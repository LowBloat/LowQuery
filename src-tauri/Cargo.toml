[package]
name = "lowquery"
version = "0.1.2"
description = "Lightweight SQL client for multiple databases"
authors = ["LowBloat"]
license = "AGPL-3.0-only"
repository = "https://github.com/LowBloat/LowQuery"
edition = "2021"
rust-version = "1.89"

[lib]
# The `_lib` suffix avoids a name clash between the binary and the library on Windows.
name = "lowquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# PostgreSQL: native async protocol, TLS via rustls.
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Oracle: official pure-Rust driver (thin mode), no Oracle Client needed.
oracledb = "=26.0.0-beta.4"
# Passwords in the OS credential store.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Oracle homes registered by Windows installers.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
